<div class="studio-chip-group data-model-selector-group" data-guide="data-model-selector">
  <span class="studio-chip-label" id="dataModel">Pathology</span>
  <div class="studio-chip-row data-model-chip-row" role="group" aria-labelledby="dataModel">
    @for (model of models(); track model) {
    <label class="studio-chip data-model-chip" [class.is-selected]="isOptionSelected(model)">
      <input
        type="radio"
        name="dataModel"
        [checked]="isOptionSelected(model)"
        (change)="selectModel(model)"
      />
      <span class="model-radio-indicator" aria-hidden="true"></span>
      <span class="model-label">{{ model.label }}</span>
    </label>
    }
  </div>
</div>
